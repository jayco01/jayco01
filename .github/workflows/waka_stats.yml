name: Waka Readme

on:
  schedule:
    - cron: '0 0 * * *'
  
  workflow_dispatch:

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          
          API_BASE_URL: https://wakapi.dev/api

          SHOW_TITLE: true 
          SHOW_TIME: true
          TIME_RANGE: 7_days
          SHOW_TOTAL: true
          BLOCKS: "=>"
